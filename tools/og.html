<!doctype html>
<!-- Share image template (1200x630). Filled from the query string by tools/build.mjs --og. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      --accent: #2f6fde; --soft: #e6eefc;
      font-family: Inter, 'IBM Plex Sans Arabic', sans-serif; color: #141a2b;
      background:
        radial-gradient(800px 500px at 85% 20%, var(--soft), transparent 70%),
        linear-gradient(rgba(47,111,222,.06) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, rgba(47,111,222,.06) 1px, transparent 1px) 0 0 / 40px 40px,
        #f6f7fb;
      display: flex; flex-direction: column; padding: 64px 72px;
    }
    body.pdf { --accent: #e0483e; --soft: #fdeceb; }
    body.qa { --accent: #12805c; --soft: #def3ea; }
    body[dir="rtl"] { font-family: 'IBM Plex Sans Arabic', Inter, sans-serif; }
    .brand { display: flex; align-items: center; gap: 14px; font: 700 30px Inter, sans-serif; direction: ltr; }
    .brand { align-self: flex-start; }
    .brand i { width: 46px; height: 46px; border-radius: 12px; background: #2f6fde; display: grid; place-items: center; }
    .brand i::before { content: ''; width: 20px; height: 24px; border: 3px solid #fff; border-radius: 3px; }
    .brand span { color: #2f6fde; }
    .main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .bar { width: 96px; height: 10px; border-radius: 5px; background: var(--accent); }
    h1 { font-size: 88px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; max-width: 1050px; }
    body[dir="rtl"] h1 { font-weight: 700; letter-spacing: 0; line-height: 1.25; }
    body.home h1 { font-size: 76px; }
    p { font-size: 40px; font-weight: 500; color: #3b4459; max-width: 1050px; line-height: 1.3; }
    .chips { display: flex; gap: 14px; }
    .chips b { font-size: 26px; font-weight: 700; padding: 12px 22px; border-radius: 999px; background: #fff; border: 2px solid #dfe3ec; }
    .chips b:first-child { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <div class="brand"><i></i>File Manager <span>Toolkit</span></div>
  <div class="main">
    <div class="bar"></div>
    <h1 id="name"></h1>
    <p id="pitch"></p>
  </div>
  <div class="chips" id="chips"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const ar = q.get('lang') === 'ar';
    document.body.dir = ar ? 'rtl' : 'ltr';
    document.body.className = `${q.get('cat') || 'files'}${q.get('home') ? ' home' : ''}`;
    document.getElementById('name').textContent = q.get('name') || 'File Manager Toolkit';
    document.getElementById('pitch').textContent = q.get('pitch') || '';
    const chips = ar ? ['مجاني', 'ملفاتك لا تُرفع', 'بدون تسجيل'] : ['Free', 'Files never uploaded', 'No sign-up'];
    document.getElementById('chips').innerHTML = chips.map((c) => `<b>${c}</b>`).join('');
  </script>
</body>
</html>
